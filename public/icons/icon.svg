<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Source for icon-{16,32,48,128}.png: rsvg-convert -w N -h N icon.svg -o icon-N.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26241f"/><stop offset="1" stop-color="#0e0d0b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d9a8"/><stop offset=".55" stop-color="#d4a160"/><stop offset="1" stop-color="#9a6a32"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#d4a160" stop-opacity=".22"/><stop offset="1" stop-color="#d4a160" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1.5"/>
  <!-- outer ring (session): track + 75% arc -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="12"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="169.6 226.2" transform="rotate(-90 64 64)"/>
  <!-- inner ring (weekly): track + 45% arc -->
  <circle cx="64" cy="64" r="17" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="9"/>
  <circle cx="64" cy="64" r="17" fill="none" stroke="#f6d9a8" stroke-opacity=".85" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="48.1 106.8" transform="rotate(-90 64 64)"/>
</svg>
